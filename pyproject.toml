[project]
name = "ottawa-home-value"
version = "0.1.0"
description = "Ottawa home value estimation from MLS sold data: LightGBM vs a neural network vs a comps baseline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "torch>=2.4",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
db = ["psycopg[binary]>=3.2"]
tabpfn = ["tabpfn>=2.0"]
photos = ["open_clip_torch>=2.24", "pillow>=10"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
